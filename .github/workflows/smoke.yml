name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: smoke (默认环境)
        run: python tests/smoke.py
      - name: smoke (PYTHONIOENCODING=utf-8)
        run: python tests/smoke.py
        env:
          PYTHONIOENCODING: utf-8
      - name: 边界回归（BOM / 英文 / null / 生成器量级）
        run: python tests/test_edges.py
